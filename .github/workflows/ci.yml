name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - name: Install protobuf compiler for optional SPIFFE support
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    # Enforce the workspace MSRV declared in `[workspace.package]
    # rust-version`. A change that uses a stable-only API newer than
    # this fails CI here, before downstream consumers hit it.
    name: msrv
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --all-targets

  test:
    name: cargo test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install protobuf compiler for optional SPIFFE support
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      # Doctests are run separately so a single failing docstring
      # fails CI even when the lib tests pass. Mirrors `cargo test`
      # output for the lib crate but only runs the doc-tests.
      - run: cargo test --workspace --doc
      - name: Generate Rust and protobuf API references
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          protoc --descriptor_set_out=/tmp/agentguard.pb \
            --include_imports \
            crates/agentguard-server/proto/agentguard.proto
          test -s /tmp/agentguard.pb
      - run: cargo build --workspace --release
      - run: cargo bench --workspace --no-run

  ts:
    name: typescript workspace
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          version: 11.22.0
          runtime: node@22.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:public
      - run: pnpm check:docs
      - run: node scripts/verify-k8s.mjs
      - name: Check documentation site
        working-directory: site
        run: pnpm config set dangerouslyAllowAllBuilds true && pnpm install --frozen-lockfile && pnpm check && pnpm build
      - name: Verify built documentation links
        run: node scripts/verify-site-links.mjs site/dist
      # Build the SDK first so dependents (frontend, examples) can resolve it.
      - run: pnpm --filter agentguard build
      - name: Verify TypeScript API declarations
        run: test -s typescript/agentguard/dist/index.d.ts
      - run: pnpm --filter agentguard test
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend typecheck
      - run: pnpm --filter frontend test
      - run: pnpm --filter frontend build
      # Full auth flow (mock IdP/PDP) against the production build.
      - run: pnpm --filter frontend exec node scripts/e2e.mjs
      # The Strands example needs LLM credentials to run; CI only typechecks it.
      - run: pnpm --filter strands-tool-authz exec tsc --noEmit

  containers:
    name: production container builds
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [test, ts]
    steps:
      - uses: actions/checkout@v5
      - name: Build PDP image
        run: docker build --pull --tag agentguard-server:ci .
      - name: Validate PDP image entrypoint
        run: docker run --rm agentguard-server:ci --help
      - name: Validate PDP audit CLI
        run: docker run --rm --entrypoint /usr/local/bin/agentguard agentguard-server:ci audit --help
      - name: Validate PDP stays live past the graceful-drain boundary
        run: |
          container=$(docker run --detach --publish 8443:8443 \
            agentguard-server:ci)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:8443/healthz || true)
            if [ "$status" = "200" ]; then break; fi
            sleep 1
          done
          sleep 35
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8443/healthz)" = "200"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --data '{}' http://127.0.0.1:8443/access/v1/evaluation)
          test "$status" = "401"
      - name: Build console image
        run: docker build --pull --tag agentguard-console:ci -f frontend/Dockerfile .
      - name: Validate console image entrypoint
        run: |
          container=$(docker run --detach --publish 3000:3000 agentguard-console:ci)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/login || true)
            if [ "$status" = "503" ]; then exit 0; fi
            sleep 2
          done
          echo "console did not reach its fail-closed readiness state"
          docker logs "$container"
          exit 1
      - name: Scan PDP image for fixable high and critical vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.66.0 image
          --exit-code 1
          --ignore-unfixed
          --severity HIGH,CRITICAL
          agentguard-server:ci
      - name: Scan console image for fixable high and critical vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.66.0 image
          --exit-code 1
          --ignore-unfixed
          --severity HIGH,CRITICAL
          agentguard-console:ci

  kubernetes:
    name: Kubernetes PDP smoke
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [containers]
    steps:
      - uses: actions/checkout@v5
      - name: Build PDP image
        run: |
          docker build --pull --tag agentguard-server:smoke .
          docker tag agentguard-server:smoke agentguard-server:smoke-rollback
      - uses: helm/kind-action@v1.12.0
        with:
          node_image: kindest/node:v1.31.4
          cluster_name: agentguard-smoke
      - name: Load PDP image into Kind
        run: |
          kind load docker-image agentguard-server:smoke --name agentguard-smoke
          kind load docker-image agentguard-server:smoke-rollback --name agentguard-smoke
      - name: Run Kubernetes startup, decision, audit, termination, and rollback smoke test
        env:
          AGENTGUARD_KIND_CLUSTER: agentguard-smoke
        run: ./scripts/k8s-smoke.sh

  deny:
    name: cargo-deny
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo install cargo-deny --locked
      # Bans + licenses + sources are blocking: we own the surface and
      # can fix violations directly.
      - run: cargo deny check bans licenses sources
      # Advisories are blocking. The deny.toml ignore list reflects
      # the only known transitive vulnerabilities (ring <0.17, see
      # CHANGELOG.md for the v0.3 follow-up).
      - run: cargo deny check advisories

  audit:
    name: cargo audit
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo install cargo-audit --locked
      # Hard gate: any unignored advisory fails CI.
      # The optional SPIFFE client currently pins jsonwebtoken 8 / tonic 0.11,
      # which pull the archived ring 0.16, rustls-pemfile, and h2 0.3 trees.
      # These are not used by the default build; keep the audit gate strict
      # for all other advisories until that upstream feature is updated.
      - run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2025-0009
          --ignore RUSTSEC-2025-0010
          --ignore RUSTSEC-2025-0134
          --ignore RUSTSEC-2026-0258

  coverage:
    name: cargo llvm-cov
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path coverage.lcov
      - name: enforce 80% line coverage
        run: |
          COV=$(cargo llvm-cov report --summary-only | grep -oE '[0-9.]+\.[0-9]+%' | head -1 | tr -d '%')
          echo "Line coverage: $COV%"
          awk -v cov="$COV" 'BEGIN { exit !(cov+0 >= 80) }'
          echo "Coverage gate passed: $COV% >= 80%"

  fuzz:
    name: cargo fuzz (nightly)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: fmt
    # Nightly fuzz job to keep the existing fuzz harnesses honest.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_call') &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      # Each harness runs for 60 seconds; coverage grows quickly
      # because the audit log + decision cache are the hot paths.
      - run: cargo fuzz run --release hash_chain_append -- -max_total_time=60
      - run: cargo fuzz run --release canonical_json -- -max_total_time=60
      - run: cargo fuzz run --release glob_match -- -max_total_time=60

  miri:
    name: cargo miri (nightly)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: fmt
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_call') &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    # These tests use tempfile-backed policy fixtures; Miri's default
    # isolation rejects the mkdir calls needed to create them.
    env:
      MIRIFLAGS: "-Zmiri-disable-isolation"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri
      - run: cargo miri setup
      # Miri is slow; just the cryptographic + canonical-JSON paths.
      - run: cargo miri test -p agentguard-core --lib decision::chain
      - run: cargo miri test -p agentguard-core --lib decision::canonical
      - run: cargo miri test -p agentguard-core --lib delegation::tests::glob_match_wildcards
