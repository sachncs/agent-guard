name: deploy-site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: 11.22.0
          runtime: node@22.19.0
          cache: true
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache Rust API documentation build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: site-rustdoc

      - name: Generate version-matched Rust API docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Install dependencies
        working-directory: site
        run: pnpm config set dangerouslyAllowAllBuilds true && pnpm install --frozen-lockfile

      - name: Build and check documentation site
        working-directory: site
        env:
          PUBLIC_AGENTGUARD_RUSTDOC: "true"
        run: pnpm check && pnpm build

      - name: Stage generated API reference
        run: node scripts/stage-rustdoc.mjs

      - name: Verify all published site links
        run: node scripts/verify-site-links.mjs site/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
