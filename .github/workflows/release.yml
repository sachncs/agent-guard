name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to validate and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-tag:
    name: resolve and validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve existing semantic-version tag
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-$REF_NAME}"
          node scripts/validate-release-tag.mjs "$tag"
          if ! git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            echo "Release tag does not exist: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-gate:
    name: release gate
    needs: resolve-tag
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.tag }}
    permissions:
      contents: read

  publish:
    name: publish release images and GitHub release
    needs: [resolve-tag, release-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0
      - name: Inspect existing release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          releases="$(gh release list --limit 1000 --json tagName,isDraft)"
          existing="$(jq -c --arg tag "$RELEASE_TAG" '[.[] | select(.tagName == $tag)] | first // empty' <<< "$releases")"
          if [ -z "$existing" ]; then
            echo "action=create" >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r '.isDraft' <<< "$existing")" = "true" ]; then
            echo "action=resume" >> "$GITHUB_OUTPUT"
          else
            assets="$(gh release view "$RELEASE_TAG" --json assets)"
            if ! jq -e '.assets | any(.name == "image-digests.txt")' <<< "$assets" >/dev/null; then
              echo "Published release $RELEASE_TAG has no image-digests.txt; refusing to mutate a published release." >&2
              exit 1
            fi
            # Published releases are treated as immutable. A successful rerun
            # is a no-op; it must not rebuild and replace versioned image tags.
            echo "action=done" >> "$GITHUB_OUTPUT"
          fi
      - name: Set release image coordinates
        id: image
        if: steps.release-state.outputs.action != 'done'
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${GH_REPOSITORY%%/*}"
          repository="${GH_REPOSITORY#*/}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "$repository" | tr '[:upper:]' '[:lower:]')"
          # Docker tags do not allow SemVer build-metadata '+'. Preserve a
          # unique, reversible-enough release alias by replacing it with '_'.
          docker_tag="${RELEASE_TAG//+/_}"
          {
            echo "server=ghcr.io/${owner}/${repository}-server"
            echo "console=ghcr.io/${owner}/${repository}-console"
            echo "tag=${docker_tag}"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: steps.release-state.outputs.action != 'done'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/agentguard-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_USER" --password-stdin
      - name: Create Buildx builder
        if: steps.release-state.outputs.action != 'done'
        run: docker buildx create --name agentguard-release --driver docker-container --use
      - name: Build and publish PDP image
        if: steps.release-state.outputs.action != 'done'
        env:
          SERVER_IMAGE: ${{ steps.image.outputs.server }}
          RELEASE_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --tag "${SERVER_IMAGE}:${RELEASE_IMAGE_TAG}" \
            --metadata-file /tmp/agentguard-server-metadata.json \
            --push \
            .
      - name: Build and publish console image
        if: steps.release-state.outputs.action != 'done'
        env:
          SERVER_IMAGE: ${{ steps.image.outputs.server }}
          CONSOLE_IMAGE: ${{ steps.image.outputs.console }}
          RELEASE_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --build-arg "AGENTGUARD_CLI_IMAGE=${SERVER_IMAGE}:${RELEASE_IMAGE_TAG}" \
            --tag "${CONSOLE_IMAGE}:${RELEASE_IMAGE_TAG}" \
            --metadata-file /tmp/agentguard-console-metadata.json \
            --file frontend/Dockerfile \
            --push \
            .
      - name: Verify anonymous registry pulls
        if: steps.release-state.outputs.action != 'done'
        env:
          SERVER_IMAGE: ${{ steps.image.outputs.server }}
          CONSOLE_IMAGE: ${{ steps.image.outputs.console }}
          RELEASE_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          anonymous_config="${RUNNER_TEMP}/agentguard-anonymous-docker-config"
          mkdir -p "$anonymous_config"
          # No credentials are present in this isolated Docker config. The
          # release cannot be announced until both images are publicly pullable.
          docker --config "$anonymous_config" pull "${SERVER_IMAGE}:${RELEASE_IMAGE_TAG}"
          docker --config "$anonymous_config" pull "${CONSOLE_IMAGE}:${RELEASE_IMAGE_TAG}"
      - name: Scan release PDP image
        if: steps.release-state.outputs.action != 'done'
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/agentguard-docker-config
          SERVER_IMAGE: ${{ steps.image.outputs.server }}
          RELEASE_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: >-
          docker run --rm
          -e DOCKER_CONFIG=/root/.docker
          -v "${DOCKER_CONFIG}:/root/.docker:ro"
          aquasec/trivy:0.66.0 image
          --image-src remote
          --exit-code 1
          --ignore-unfixed
          --severity HIGH,CRITICAL
          "${SERVER_IMAGE}:${RELEASE_IMAGE_TAG}"
      - name: Scan release console image
        if: steps.release-state.outputs.action != 'done'
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/agentguard-docker-config
          CONSOLE_IMAGE: ${{ steps.image.outputs.console }}
          RELEASE_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: >-
          docker run --rm
          -e DOCKER_CONFIG=/root/.docker
          -v "${DOCKER_CONFIG}:/root/.docker:ro"
          aquasec/trivy:0.66.0 image
          --image-src remote
          --exit-code 1
          --ignore-unfixed
          --severity HIGH,CRITICAL
          "${CONSOLE_IMAGE}:${RELEASE_IMAGE_TAG}"
      - name: Record registry digests
        if: steps.release-state.outputs.action != 'done'
        env:
          SERVER_IMAGE: ${{ steps.image.outputs.server }}
          CONSOLE_IMAGE: ${{ steps.image.outputs.console }}
          RELEASE_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          server_digest="$(jq -er '.["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' /tmp/agentguard-server-metadata.json)"
          console_digest="$(jq -er '.["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' /tmp/agentguard-console-metadata.json)"
          {
            echo "# AgentGuard ${RELEASE_IMAGE_TAG} release image digests"
            echo "PDP: ${SERVER_IMAGE}@${server_digest}"
            echo "Console: ${CONSOLE_IMAGE}@${console_digest}"
            echo "Platform: linux/amd64"
          } > image-digests.txt
      - name: Create release from changelog
        if: steps.release-state.outputs.action != 'done'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          if [ "${{ steps.release-state.outputs.action }}" = "resume" ]; then
            gh release edit "$RELEASE_TAG" \
              --title "AgentGuard $RELEASE_TAG" \
              --notes-file CHANGELOG.md
            gh release upload "$RELEASE_TAG" image-digests.txt --clobber
            gh release edit "$RELEASE_TAG" --draft=false --verify-tag
          else
            gh release create "$RELEASE_TAG" image-digests.txt \
              --verify-tag \
              --draft \
              --title "AgentGuard $RELEASE_TAG" \
              --generate-notes \
              --notes-file CHANGELOG.md
            gh release edit "$RELEASE_TAG" --draft=false --verify-tag
          fi
