[package]
name = "rust-embedder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Embed the AuthZEN PDP router inside an existing axum app"

[[bin]]
name = "rust-embedder"
path = "src/main.rs"

[dependencies]
agentguard-server = { path = "../../crates/agentguard-server", version = "0.2.0" }
agentguard-telemetry = { path = "../../crates/agentguard-telemetry", version = "0.2.0" }

anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = "0.7"
tower = "0.5"
tracing.workspace = true
tracing-subscriber.workspace = true
