apiVersion: apps/v1
kind: Deployment
metadata: {name: agentguard-console}
spec:
  replicas: 1
  selector: {matchLabels: {app: agentguard-console}}
  template:
    metadata: {labels: {app: agentguard-console}}
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions: [{key: app, operator: In, values: [agentguard-pdp]}]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: console
          image: agentguard-console:0.2.0
          ports: [{name: http, containerPort: 3000}]
          envFrom: [{secretRef: {name: agentguard-console-env}}]
          env:
            - name: AGENTGUARD_PDP_BEARER
              valueFrom:
                secretKeyRef:
                  name: agentguard-console-env
                  key: AGENTGUARD_PDP_BEARER
            - {name: AGENTGUARD_PDP_URL, value: http://agentguard-pdp:8443}
            - {name: AGENTGUARD_BIN, value: /usr/local/bin/agentguard}
            - {name: AGENTGUARD_STORE, value: /var/lib/agentguard/policies}
            - {name: AGENTGUARD_AUDIT, value: /var/lib/agentguard/audit/decisions.jsonl}
            - {name: AGENTGUARD_DELEGATION_KEY_FILE, value: /etc/agentguard/delegation/delegation.key}
          volumeMounts:
            - {name: policies, mountPath: /var/lib/agentguard/policies, readOnly: true}
            - {name: audit, mountPath: /var/lib/agentguard/audit, readOnly: true}
            - {name: delegation, mountPath: /etc/agentguard/delegation, readOnly: true}
          readinessProbe: {httpGet: {path: /api/health/ready, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health/live, port: http}, periodSeconds: 20}
          startupProbe: {httpGet: {path: /api/health/live, port: http}, failureThreshold: 30, periodSeconds: 2}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
        - name: policies
          configMap:
            name: agentguard-policies
            items:
              - {key: schema.cedarschema, path: schema.cedarschema}
              - {key: 20_agents.cedar, path: policies/20_agents.cedar}
        - {name: audit, persistentVolumeClaim: {claimName: agentguard-audit}}
        - {name: delegation, secret: {secretName: agentguard-delegation-key}}
---
apiVersion: v1
kind: Service
metadata: {name: agentguard-console}
spec:
  selector: {app: agentguard-console}
  ports: [{name: http, port: 3000, targetPort: http}]
