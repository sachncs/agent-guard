apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentguard-pdp
  labels: {app: agentguard-pdp}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: agentguard-pdp}}
  template:
    metadata: {labels: {app: agentguard-pdp}}
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pdp
          image: agentguard-server:0.2.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8443}]
          env:
            # Make the pod-IP listener explicit instead of depending on the
            # image default; the Kubernetes Service cannot reach loopback.
            - {name: AGENTGUARD_LISTEN, value: tcp://0.0.0.0:8443}
            - {name: AGENTGUARD_AUTH, value: "apikey:/etc/agentguard/keys/keys.json"}
            - {name: AGENTGUARD_CHAIN_SECRET, value: /etc/agentguard/secrets/chain-secret}
            # Segment files for predictable archival; this does not enforce retention.
            - {name: AGENTGUARD_AUDIT_MAX_BYTES, value: "67108864"}
          volumeMounts:
            - {name: policies, mountPath: /var/lib/agentguard/policies, readOnly: true}
            - {name: audit, mountPath: /var/lib/agentguard/audit}
            - {name: secrets, mountPath: /etc/agentguard/secrets, readOnly: true}
            - {name: keys, mountPath: /etc/agentguard/keys, readOnly: true}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          startupProbe: {httpGet: {path: /healthz, port: http}, failureThreshold: 30, periodSeconds: 2}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: policies
          configMap:
            name: agentguard-policies
            items:
              - {key: schema.cedarschema, path: schema.cedarschema}
              - {key: 20_agents.cedar, path: policies/20_agents.cedar}
        - {name: audit, persistentVolumeClaim: {claimName: agentguard-audit}}
        - {name: secrets, secret: {secretName: agentguard-secrets}}
        - {name: keys, secret: {secretName: agentguard-api-keys}}
---
apiVersion: v1
kind: Service
metadata: {name: agentguard-pdp}
spec:
  selector: {app: agentguard-pdp}
  ports: [{name: http, port: 8443, targetPort: http}]
